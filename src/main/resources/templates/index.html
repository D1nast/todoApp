<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Atelier</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}" href="/css/layout.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="/">
            <span class="brand-mark">T</span>
            <span>Todo Atelier</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
            <a href="#today">Today</a>
            <a href="#tasks">Tasks</a>
            <a href="#focus">Focus</a>
        </nav>
        <div class="header-actions">
            <a class="ghost-button" href="#tasks">View tasks</a>
            <a class="primary-button" href="#new-task">New task</a>
        </div>
    </div>
</header>

<main class="page-shell">
    <section class="todo-wrap" id="today">
        <section class="todo-panel" id="tasks" aria-labelledby="task-panel-title">
            <div class="panel-header">
                <div>
                    <p class="panel-kicker">Workspace</p>
                    <h2 class="panel-title" id="task-panel-title">Tasks</h2>
                </div>
                <span class="task-count" th:text="${tasks != null ? #lists.size(tasks) : 0}">0</span>
            </div>

            <table class="task-table" th:if="${tasks != null and !#lists.isEmpty(tasks)}">
                <thead>
                    <tr>
                        <th scope="col">Task</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="task : ${tasks}">
                        <td th:text="${task.content}">content</td>
                    </tr>
                </tbody>
            </table>

            <p class="empty-state" th:unless="${tasks != null and !#lists.isEmpty(tasks)}">
                No tasks yet.
            </p>
        </section>
    </section>

    <form class="task-input-form" method="post" action="/add/0" th:action="@{/add/{id}}" th:object="${TaskForm}">
        <input class="task-input" type="text" name="name" th:field="*{content}" placeholder="Enter your task." autocomplete="off" required>
        <button class="task-submit-button" type="submit">Add</button>
    </form>
</main>
</body>
</html>
